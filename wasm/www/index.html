<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VaultKey — spike WASM (étape 2)</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; color: #16161A; }
  input { font-size: 14px; padding: 6px 10px; width: 280px; }
  button { font-size: 14px; padding: 6px 14px; margin-left: 8px; }
  pre { background: #F2F2F0; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  .ok { color: #1F7A4D; }
  .fail { color: #B3261E; }
</style>
</head>
<body>
  <h1>VaultKey — spike WASM</h1>
  <p>Page HTML statique, sans backend. Vérifie que le cœur Rust (chiffrement AES-GCM, enveloppes, manifeste) compile en WASM et tourne dans ce navigateur.</p>

  <input id="plaintext" value="bonjour depuis vaultkey-core" />
  <button id="run">Lancer l'aller-retour</button>

  <pre id="output">(pas encore lancé)</pre>

  <script type="module">
    import init, { demo_roundtrip } from '../pkg/vaultkey_wasm.js';

    const output = document.getElementById('output');
    const button = document.getElementById('run');

    async function main() {
      await init();
      button.disabled = false;
      output.textContent = 'module WASM chargé, prêt.';
    }

    button.addEventListener('click', () => {
      const input = document.getElementById('plaintext').value;
      const testWrapKey = new Uint8Array(32).fill(0x42); // valeur fixe : ce test isole le pipeline WASM, pas WebAuthn/PRF (voir spikes/webauthn-prf-spike/)
      try {
        const result = demo_roundtrip(testWrapKey, input);
        const ok = result === input;
        output.innerHTML = `entrée : ${input}\nsortie déchiffrée : ${result}\n<span class="${ok ? 'ok' : 'fail'}">${ok ? '✔ round-trip identique, pipeline WASM fonctionnel' : '✘ mismatch inattendu'}</span>`;
      } catch (e) {
        output.innerHTML = `<span class="fail">erreur : ${e}</span>`;
      }
    });

    button.disabled = true;
    main();
  </script>
</body>
</html>
