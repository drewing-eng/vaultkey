[package]
name = "vaultkey-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bip39 = "2.2.2"
hkdf = "0.13.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4"] }
web-time = "1.1.0"
zeroize = { version = "1.9.0", features = ["derive"] }
